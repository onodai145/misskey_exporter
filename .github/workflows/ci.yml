name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod says "go 1.26.0", which setup-go would install as-is. Track the
          # latest 1.26.x so that standard library security fixes are included.
          go-version: "1.26"
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Test scripts
        run: bash scripts/release_test.sh
      - name: Test license scripts
        run: bash scripts/licenses_test.sh
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Check licenses
        run: scripts/licenses.sh check
