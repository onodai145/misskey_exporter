name: release

on:
  push:
    tags:
      - "v*"
  # Manual runs build everything with --snapshot and publish nothing.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the tags and the history to derive the version.
          fetch-depth: 0
          persist-credentials: false
      # A tag can be pushed on any commit. Only publish commits that are on main.
      - name: Verify the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod says "go 1.26.0", which setup-go would install as-is. Track the
          # latest 1.26.x so that standard library security fixes are included.
          go-version: "1.26"
          check-latest: true
          # Do not restore caches in the job that publishes release artifacts.
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Check licenses
        run: scripts/licenses.sh check
      # QEMU runs the "RUN apk add" step of Dockerfile.release for linux/arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
